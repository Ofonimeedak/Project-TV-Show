<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Ofonimeedak</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <header class="header">
      <h1>Browse Amazing TV Shows</h1>
    </header>

    <!-- <p id="error"></p> -->

    <main id="root">
      <!-- filtering container -->
      <div class="filter-container">
        <select id="tvShowSelect">
          <!-- <option></option> -->
        </select>

        <select id="episodesSelect">
          <!-- <option></option> -->
        </select>

        <span id="episode-count"></span>

        <label id="label"
          >Search <input type="text" id="search" placeholder="Search episodes"
        /></label>
        <button class="backBtn"></button>
        <p id="show-count"></p>
        <label class="label" id="show-search">
          Filtering for
          <input id="searchShow" type="text" placeholder="Search Show here"
        /></label>
      </div>

      <!-- Episodes container -->
      <div id="main-container" class="episode-grid"></div>
      <span id="message"></span>

      <!-- TV Shows Template -->
      <template class="show-card" id="show-card">
        <article class="show-container">
          <div class="head-image-container" data-id="">
            <h2 class="show-name"></h2>
            <img alt="TV show image" class="tvshow-img" />
          </div>

          <div class="show-summary"></div>

          <label class="info">
            <p class="rating"></p>
            <p class="genre"></p>
            <p class="status"></p>

            <p class="runtime"></p>
          </label>

          <!-- <h2>title rating gentre runtime status summary</h2> -->
        </article>
      </template>

      <!-- Episodes template -->
      <template id="episode-card">
        <article class="episode-card">
          <h2 class="episode-title">
            <span class="episode-name"></span>
            <span class="episode-code"></span>
          </h2>
          <img class="episode-image" alt="episode image" />
          <p class="episode-summary"></p>
        </article>
      </template>
    </main>

    <footer>
      <p>API Consumed from <a href="https://tvmaze.com/">TVMaze.com</a></p>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
